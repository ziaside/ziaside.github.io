<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ziaside — Personal app projects by Zia." />
  <title>Ziaside</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #777772;
      --line: #e8e8e8;
      --card: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      min-height: 100vh;
      padding: 36px 0 28px;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .topnav {
      display: flex;
      gap: 22px;
      font-size: 14px;
      color: var(--muted);
    }

    .topnav a:hover,
    .footer a:hover {
      color: var(--text);
    }

    .hero {
      padding: 76px 0 86px;
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 48px;
      align-items: end;
    }

    .hero h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(44px, 7vw, 92px);
      line-height: 0.96;
      letter-spacing: -0.065em;
      font-weight: 700;
    }

    .hero-copy {
      justify-self: end;
      max-width: 320px;
      font-size: 16px;
      line-height: 1.7;
      color: var(--muted);
      word-break: keep-all;
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .section-head h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .section-head span {
      font-size: 13px;
      color: var(--muted);
    }

    .projects {
      margin-bottom: 84px;
    }

    .project {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 24px;
      align-items: start;
      padding: 30px 0 34px;
      border-bottom: 1px solid var(--line);
    }

    .project-number {
      font-size: 13px;
      color: var(--muted);
      padding-top: 7px;
    }

    .project-main h3 {
      margin: 0 0 10px;
      font-size: clamp(30px, 4vw, 54px);
      line-height: 1;
      letter-spacing: -0.045em;
      font-weight: 650;
    }

    .project-main p {
      margin: 0;
      max-width: 650px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      word-break: keep-all;
    }

    .meta {
      min-width: 150px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      padding-top: 3px;
    }

    .status,
    .platform {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 5px 10px 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    .status {
      background: var(--card);
    }

    .platform {
      color: var(--muted);
    }

    .footer {
      margin-top: auto;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 20px;
    }

    .copyright {
      text-align: right;
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 32px, 1180px);
        padding-top: 24px;
      }

      .topbar {
        align-items: flex-start;
      }

      .topnav {
        gap: 14px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 54px 0 64px;
        gap: 28px;
      }

      .hero-copy {
        justify-self: start;
        max-width: 100%;
      }

      .project {
        grid-template-columns: 42px 1fr;
        gap: 16px;
      }

      .meta {
        grid-column: 2;
        min-width: 0;
        align-items: flex-start;
        flex-direction: row;
        flex-wrap: wrap;
        padding-top: 2px;
      }

      .footer {
        justify-content: flex-start;
      }

      .copyright {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="/">Ziaside</a>

      <nav class="topnav" aria-label="Primary">
        <a href="https://github.com/ziaside" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="mailto:ziaa3761@gmail.com">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Ideas,<br />made into apps.</h1>

      <div class="hero-copy">
        Personal app projects by Zia.
      </div>
    </section>

    <section class="projects" id="apps">
      <div class="section-head">
        <h2>Selected Apps</h2>
        <span>2026 —</span>
      </div>

      <article class="project">
        <div class="project-number">01</div>

        <div class="project-main">
          <h3>SnapLog</h3>
          <p>
            사진 한 장과 간단한 기록을 주제별로 모아보는 iOS 기록 앱.
            흩어진 일상의 순간을 하나의 로그로 남깁니다.
          </p>
        </div>

        <div class="meta">
          <span class="status">Coming Soon</span>
          <span class="platform">iOS</span>
        </div>
      </article>

      <article class="project">
        <div class="project-number">02</div>

        <div class="project-main">
          <h3>TomatoNyang</h3>
          <p>
            집중하는 시간 동안 토마토냥의 하루가 함께 채워지는
            캐릭터 기반 뽀모도로 타이머 앱.
          </p>
        </div>

        <div class="meta">
          <span class="status">In Progress</span>
          <span class="platform">iOS</span>
        </div>
      </article>
    </section>

    <footer class="footer">
      <div class="copyright">© 2026 Ziaside</div>
    </footer>
  </main>
</body>
</html>
