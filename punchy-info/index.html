    *{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#222}body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.header{height:72px;border-bottom:1px solid #eceff3;display:flex;align-items:center}.header-inner{width:min(1120px,calc(100% - 48px));margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{font-size:18px;font-weight:800;letter-spacing:-.04em}.back{font-size:14px;color:#737982;white-space:nowrap}.page{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:34px 0 80px}.toolbar{display:flex;justify-content:flex-end;margin-bottom:22px}.lang{appearance:none;-webkit-appearance:none;height:46px;min-width:142px;padding:0 38px 0 15px;border:1px solid #dfe3e8;border-radius:14px;background:#fff;font:inherit;font-size:15px;color:#4f5660}.app-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:38px}.app-identity{display:flex;align-items:center;gap:18px;min-width:0}.app-icon{display:block;width:92px;height:92px;border-radius:22px;border:1px solid #edf0f4;box-shadow:0 8px 24px rgba(34,34,34,.05);object-fit:cover;flex:0 0 auto}.app-copy{min-width:0}.app-copy h1{margin:0 0 7px;font-size:36px;line-height:1.05;letter-spacing:-.045em}.app-copy p{margin:0;color:#7d8490;font-size:18px;line-height:1.45}.visit{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:116px;height:48px;padding:0 24px;border-radius:24px;background:#f888aa;color:#fff;font-size:16px;font-weight:750;box-shadow:0 8px 20px rgba(248,136,170,.24)}.section-title{font-size:24px;letter-spacing:-.035em;margin:0 0 18px}.preview{margin-bottom:54px}.screens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{margin:0;background:#fff;border:1px solid #edf0f4;border-radius:28px;overflow:hidden;box-shadow:0 14px 40px rgba(34,34,34,.06)}.card img{display:block;width:100%;height:auto}.description{width:min(860px,100%);margin:0 auto;border-top:1px solid #eceff3;padding-top:42px}.description h2{font-size:26px;letter-spacing:-.035em;margin:0 0 18px}.description h3{font-size:18px;margin:30px 0 8px}.description p{font-size:15px;line-height:1.8;color:#4f5660;margin:0 0 14px}.footer{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:28px 0 36px;border-top:1px solid #eceff3;color:#8b9199;font-size:12px;display:flex;justify-content:space-between;gap:20px}

    @media(max-width:430px){.logo{font-size:16px}.back{font-size:13px}.app-head{gap:10px}.app-copy h1{font-size:25px}.app-copy p{font-size:13px;max-width:145px}.visit{min-width:82px;height:40px;padding:0 15px}.card{flex-basis:84vw}}

<body>
  <header class="header"><div class="header-inner"><a class="logo" href="/">zia.log</a><a class="back" id="back" href="/#apps">← 프로젝트로 돌아가기</a></div></header>
  <main class="page">
    <div class="toolbar"><select class="lang" id="language" aria-label="언어 선택"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="es">Español</option></select></div>

    <section class="preview"><h2 class="section-title" id="preview-title">이렇게 사용할 수 있어요</h2><div class="screens"><figure class="card"><img src="./assets/preview-ko-1.png" alt="Punchy! 사진 펀칭 기능 소개"></figure><figure class="card"><img src="./assets/preview-ko-2.png" alt="Punchy! 도형과 글자 펀칭 기능 소개"></figure><figure class="card"><img src="./assets/preview-ko-3.png" alt="Punchy! 활용 예시"></figure></div></section>

  <footer class="footer"><span id="translation-note">다국어 번역은 AI의 도움을 받아 제공됩니다.</span><span>© 2026 Ziaside</span></footer>
  <script>
    const copy={
      ko:{back:'← 프로젝트로 돌아가기',subtitle:'사진을 원하는 모양으로',visit:'바로가기',preview:'이렇게 사용할 수 있어요',title:'Punchy! 소개',html:'<p>Punchy!는 사진을 원, 별, 하트 같은 도형이나 원하는 글자 모양으로 펀칭하고 PNG 파일로 저장하는 웹 도구입니다.</p><h3>사진 한 장으로 간단하게</h3><p>사진을 불러온 뒤 모양과 위치를 조절하고 바로 저장할 수 있어요. 별도의 앱 설치 없이 웹에서 사용할 수 있습니다.</p><h3>원하는 곳에 자유롭게</h3><p>완성한 이미지는 투명 배경 PNG로 저장되어 인스타그램, 굿노트, 다이어리 꾸미기 등 원하는 곳에 활용할 수 있습니다.</p>',note:'다국어 번역은 AI의 도움을 받아 제공됩니다.'},
      en:{back:'← Back to projects',subtitle:'Shape photos your way',visit:'Open tool',preview:'See what you can make',title:'About Punchy!',html:'<p>Punchy! is a web tool that punches photos into circles, stars, hearts, or custom letter shapes and saves them as PNG files.</p><h3>Simple from start to finish</h3><p>Load a photo, adjust its shape and position, and save it right away—no app installation required.</p><h3>Use it anywhere</h3><p>Export with a transparent background and use the result in Instagram, Goodnotes, digital journals, and more.</p>',note:'Translations are provided with the help of AI.'},
      ja:{back:'← プロジェクトに戻る',subtitle:'写真を好きな形に',visit:'開く',preview:'こんなふうに使えます',title:'Punchy! について',html:'<p>Punchy!は、写真を円・星・ハートなどの図形や好きな文字の形にパンチし、PNGで保存できるWebツールです。</p><h3>写真1枚でかんたんに</h3><p>写真を読み込み、形と位置を調整してすぐに保存できます。アプリのインストールは必要ありません。</p><h3>好きな場所で自由に</h3><p>透明背景のPNGとして保存し、InstagramやGoodnotes、デジタル手帳などに活用できます。</p>',note:'多言語翻訳はAIのサポートを利用して提供しています。'},
      'zh-Hans':{back:'← 返回项目',subtitle:'把照片变成喜欢的形状',visit:'立即体验',preview:'你可以这样使用',title:'关于 Punchy!',html:'<p>Punchy! 是一款网页工具，可将照片裁成圆形、星形、心形或自定义文字形状，并保存为 PNG。</p><h3>一张照片，轻松完成</h3><p>导入照片后调整形状和位置，即可直接保存，无需安装应用。</p><h3>自由用于各种场景</h3><p>以透明背景 PNG 导出后，可用于 Instagram、Goodnotes、电子手帐等。</p>',note:'多语言翻译由 AI 协助提供。'},
      'zh-Hant':{back:'← 返回專案',subtitle:'把照片變成喜歡的形狀',visit:'立即體驗',preview:'你可以這樣使用',title:'關於 Punchy!',html:'<p>Punchy! 是一款網頁工具，可將照片裁成圓形、星形、愛心或自訂文字形狀，並儲存為 PNG。</p><h3>一張照片，輕鬆完成</h3><p>匯入照片後調整形狀與位置，即可直接儲存，無需安裝應用程式。</p><h3>自由用於各種場景</h3><p>以透明背景 PNG 匯出後，可用於 Instagram、Goodnotes、電子手帳等。</p>',note:'多語言翻譯由 AI 協助提供。'},
      es:{back:'← Volver a proyectos',subtitle:'Dale a tus fotos la forma que quieras',visit:'Abrir',preview:'Así puedes usarlo',title:'Acerca de Punchy!',html:'<p>Punchy! es una herramienta web para recortar fotos en círculos, estrellas, corazones o letras personalizadas y guardarlas como PNG.</p><h3>Fácil de principio a fin</h3><p>Carga una foto, ajusta la forma y la posición y guárdala al instante, sin instalar ninguna app.</p><h3>Úsalo donde quieras</h3><p>Exporta con fondo transparente y utiliza el resultado en Instagram, Goodnotes, diarios digitales y más.</p>',note:'Las traducciones se ofrecen con ayuda de la IA.'}
    };
    function normalize(value){if(copy[value])return value;const locale=String(value||'').replace('_','-');if(/^zh/i.test(locale))return /hant|tw|hk|mo/i.test(locale)?'zh-Hant':'zh-Hans';const base=locale.split('-')[0].toLowerCase();return copy[base]?base:'en'}
    function apply(value){const lang=normalize(value),t=copy[lang];document.documentElement.lang=lang;document.getElementById('back').textContent=t.back;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('visit').textContent=t.visit;document.getElementById('preview-title').textContent=t.preview;document.getElementById('description-title').textContent=t.title;document.getElementById('description').innerHTML=t.html;document.getElementById('translation-note').textContent=t.note;document.getElementById('language').value=lang;localStorage.setItem('snaplogLang',lang)}
    const select=document.getElementById('language');apply(localStorage.getItem('snaplogLang')||navigator.language||'ko');select.addEventListener('change',e=>apply(e.target.value));
  </script>
