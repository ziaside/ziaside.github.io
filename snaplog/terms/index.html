<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnapLog Terms of Use</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;line-height:1.8}.wrap{width:min(780px,calc(100% - 40px));margin:0 auto;padding:64px 0 90px}a{color:#4285f4;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:32px}.brand{font-weight:800;color:#222}.tools{display:flex;align-items:center;gap:12px}.back{font-size:14px;color:#737982}.lang{border:1px solid #dfe3e8;background:#fff;border-radius:10px;padding:8px 30px 8px 10px;font:inherit;font-size:13px;color:#4f5660}h1{font-size:42px;letter-spacing:-.04em;margin:0 0 12px}.date{color:#8a9099;font-size:14px;margin-bottom:42px}h2{font-size:20px;margin:38px 0 10px}p,li{font-size:15px;color:#4f5660}ul{padding-left:20px}.box{margin-top:48px;padding:20px 22px;background:#f7f9fc;border-radius:16px;color:#555;font-size:14px}@media(max-width:600px){.wrap{padding-top:28px}.top{align-items:flex-start}.tools{flex-direction:column;align-items:flex-end;gap:8px}h1{font-size:34px}}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="../">SNAP LOG</a><div class="tools"><select id="language" class="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="es">Español</option><option value="vi">Tiếng Việt</option></select><a class="back" href="../" id="back">← 돌아가기</a></div></div><div id="content"></div></main><script>
const docs={
ko:{back:'← 돌아가기',title:'이용약관',date:'시행일: 2026년 8월 26일',intro:'본 이용약관은 SnapLog(이하 “서비스”)의 이용과 관련하여 서비스 제공자와 이용자 사이의 권리, 의무 및 기본적인 이용 조건을 정합니다.',s:[['1. 서비스의 목적 및 내용','SnapLog는 사진, 숫자, 짧은 메모 등의 기록을 주제별로 저장하고 확인할 수 있는 개인 기록 애플리케이션입니다. 일부 기능은 무료로 제공되며 광고 또는 유료 기능이 포함될 수 있습니다.'],['2. 서비스 이용','이용자는 관련 법령과 본 약관을 준수해야 하며, 타인의 권리·저작권·개인정보 등 법적 권리를 침해하는 콘텐츠를 부적절하게 이용해서는 안 됩니다. 이용자가 직접 생성·저장한 콘텐츠에 대한 책임은 이용자에게 있습니다.'],['3. 이용자 데이터 및 동기화','기록 데이터는 기기에 저장되거나 Apple iCloud/CloudKit을 통해 동기화될 수 있습니다. 기기 분실, 앱 삭제, Apple 계정 또는 네트워크·동기화 환경 문제 등으로 데이터가 손실될 수 있으므로 중요한 데이터는 이용자가 별도로 관리할 것을 권장합니다.'],['4. 광고','무료 버전 등의 일부 화면에는 Google AdMob 광고가 표시될 수 있습니다. 광고 내용과 제공 방식은 Google 및 광고 제공자의 정책, 이용자 동의와 기기 설정 등에 따라 달라질 수 있으며 외부 광고를 통해 이루어진 거래에는 해당 외부 사업자의 조건이 적용됩니다.'],['5. 인앱 구매 및 구독','일부 기능은 인앱 구매 또는 구독 형태로 제공될 수 있습니다. 결제는 Apple App Store를 통해 처리되고 구매 상태와 권한 확인·복원 등에 RevenueCat을 사용할 수 있습니다. 가격과 결제 주기는 구매 화면의 표시를 따르며 구독 관리·해지는 Apple 계정에서 진행합니다. 앱 삭제만으로 활성 구독이 자동 해지되지는 않습니다.'],['6. 외부 서비스','Apple iCloud/CloudKit 및 App Store 결제, Google AdMob 및 관련 동의 관리 도구, RevenueCat 등 외부 서비스를 사용할 수 있습니다. 외부 서비스의 장애나 정책 변경으로 일부 기능이 변경되거나 제한될 수 있습니다.'],['7. 서비스의 변경 및 중단','기능 개선, 유지보수, 기술적 문제, 외부 플랫폼 정책 변경 또는 운영상 필요에 따라 서비스 일부 또는 전부가 변경되거나 일시 중단될 수 있습니다. 중대한 변경은 가능한 범위에서 적절한 방법으로 안내합니다.'],['8. 지식재산권','SnapLog의 명칭, 로고, 디자인, 소프트웨어 및 제공자가 제작한 콘텐츠의 권리는 서비스 제공자 또는 정당한 권리자에게 있습니다. 이용자가 직접 생성한 사진과 메모 등의 권리는 해당 이용자 또는 원권리자에게 있습니다.'],['9. 책임의 제한','서비스 제공자는 고의 또는 중대한 과실이 없는 한 천재지변, 통신 장애, 외부 서비스 장애, 이용자 기기 또는 계정 문제 등 합리적으로 통제하기 어려운 사유로 발생한 장애에 대해 관련 법령이 허용하는 범위에서 책임을 제한할 수 있습니다. 법령상 제한할 수 없는 이용자 권리는 배제하지 않습니다.'],['10. 개인정보 보호','개인정보 및 외부 SDK 처리에 관한 자세한 내용은 <a href="../privacy/">SnapLog 개인정보처리방침</a>을 확인하세요.'],['11. 약관의 변경','서비스 기능 또는 관련 법령·정책이 변경되는 경우 본 약관이 수정될 수 있으며 중요한 변경은 앱 또는 웹사이트 등을 통해 안내합니다.'],['12. 준거법 및 문의','본 약관은 대한민국 법령을 기준으로 해석됩니다.<br>운영자: Ziaside<br>이메일: <a href="mailto:ziaa3761@gmail.com">ziaa3761@gmail.com</a>']]},
en:{back:'← Back',title:'Terms of Use',date:'Effective: August 26, 2026',intro:'These Terms of Use govern the basic rights, obligations, and conditions between the provider of SnapLog (the “Service”) and its users.',s:[['1. Purpose and scope of the Service','SnapLog is a personal logging app that lets users save and review photos, numbers, short notes, and other records by topic. Some features may be free, while advertising or paid features may also be offered.'],['2. Use of the Service','Users must comply with applicable laws and these Terms. Users must not misuse the Service in ways that infringe copyrights, privacy, or other legal rights of others. Users are responsible for content they create and store.'],['3. User data and synchronization','Records may be stored on the device or synchronized through Apple iCloud/CloudKit. Data loss may occur due to device loss, app deletion, Apple account issues, network problems, or synchronization conditions. Users are encouraged to separately manage important data.'],['4. Advertising','Some screens in the free version may display ads through Google AdMob. Ad content and delivery can vary according to Google and advertiser policies, user consent, and device settings. Transactions reached through external ads are subject to the relevant third party’s terms.'],['5. In-app purchases and subscriptions','Some features may be offered through in-app purchases or subscriptions. Payments are processed by Apple App Store, and RevenueCat may be used to verify and restore purchase status and entitlements. Prices and billing periods are shown at purchase. Subscriptions are managed or cancelled through the user’s Apple account. Deleting the app does not automatically cancel an active subscription.'],['6. Third-party services','SnapLog may use Apple iCloud/CloudKit and App Store payments, Google AdMob and consent tools, and RevenueCat. Outages, restrictions, or policy changes at third-party services may affect availability of some features.'],['7. Changes or interruption of the Service','The provider may change or temporarily suspend some or all of the Service for improvements, maintenance, technical issues, third-party policy changes, or operational needs. Material changes will be communicated where reasonably possible.'],['8. Intellectual property','Rights in the SnapLog name, logo, design, software, and provider-created content belong to the provider or legitimate rights holders. Rights in photos, notes, and other content created by users remain with the user or original rights holder.'],['9. Limitation of liability','Except in cases of intent or gross negligence, liability may be limited to the extent permitted by law for interruptions caused by events beyond reasonable control, including disasters, network failures, third-party outages, or user device/account issues. Rights that cannot legally be limited remain unaffected.'],['10. Privacy','For details about personal information and third-party SDKs, see the <a href="../privacy/">SnapLog Privacy Policy</a>.'],['11. Changes to these Terms','These Terms may be updated when Service features, applicable law, or policies change. Material changes will be announced through the app or website where appropriate.'],['12. Governing law and contact','These Terms are interpreted under the laws of the Republic of Korea.<br>Operator: Ziaside<br>Email: <a href="mailto:ziaa3761@gmail.com">ziaa3761@gmail.com</a>']]},
ja:{back:'← 戻る',title:'利用規約',date:'施行日：2026年8月26日',intro:'本利用規約は、SnapLog（以下「本サービス」）の利用に関する提供者とユーザー間の権利、義務および基本条件を定めます。',s:[['1. サービスの目的と内容','SnapLogは写真、数値、短いメモなどをテーマ別に保存・確認できる個人記録アプリです。一部機能は無料で提供され、広告または有料機能が含まれる場合があります。'],['2. サービスの利用','ユーザーは関連法令と本規約を遵守し、他者の著作権、プライバシーその他の法的権利を侵害する形で利用してはなりません。ユーザーが作成・保存したコンテンツについてはユーザーが責任を負います。'],['3. ユーザーデータと同期','記録は端末に保存されるほか、Apple iCloud/CloudKitを通じて同期される場合があります。端末紛失、アプリ削除、Appleアカウントやネットワーク・同期環境の問題などによりデータが失われる可能性があるため、重要なデータは別途管理することを推奨します。'],['4. 広告','無料版などの一部画面にGoogle AdMob広告が表示される場合があります。広告内容と配信方法はGoogle・広告提供者の方針、ユーザーの同意・端末設定等により異なります。外部広告から行われる取引には当該第三者の条件が適用されます。'],['5. アプリ内購入とサブスクリプション','一部機能をアプリ内購入またはサブスクリプションで提供する場合があります。決済はApple App Storeで処理され、購入状態や権利の確認・復元にRevenueCatを利用する場合があります。価格と請求周期は購入画面に表示され、購読管理・解約はAppleアカウントで行います。アプリ削除だけでは購読は自動解約されません。'],['6. 外部サービス','Apple iCloud/CloudKit・App Store決済、Google AdMob・同意管理ツール、RevenueCatなどを利用する場合があります。外部サービスの障害や方針変更により一部機能が変更・制限されることがあります。'],['7. サービスの変更・中断','機能改善、保守、技術的問題、外部プラットフォーム方針変更、運営上の必要によりサービスの一部または全部を変更・一時中断する場合があります。重要な変更は可能な範囲で案内します。'],['8. 知的財産権','SnapLogの名称、ロゴ、デザイン、ソフトウェアおよび提供者作成コンテンツの権利は提供者または正当な権利者に帰属します。ユーザーが作成した写真やメモ等の権利はユーザーまたは原権利者に帰属します。'],['9. 責任の制限','故意または重大な過失がない限り、災害、通信障害、外部サービス障害、ユーザー端末・アカウント問題など合理的に管理できない事由による障害について、法令が許す範囲で責任を制限する場合があります。'],['10. プライバシー','個人情報および外部SDKの取扱いは<a href="../privacy/">SnapLogプライバシーポリシー</a>をご確認ください。'],['11. 規約の変更','機能、法令または関連方針の変更に伴い本規約を更新する場合があります。重要な変更はアプリまたはウェブサイト等で案内します。'],['12. 準拠法・お問い合わせ','本規約は大韓民国法令に基づき解釈されます。<br>運営者：Ziaside<br>メール：<a href="mailto:ziaa3761@gmail.com">ziaa3761@gmail.com</a>']]},
'zh-Hans':{back:'← 返回',title:'使用条款',date:'生效日期：2026年8月26日',intro:'本使用条款规定 SnapLog（以下简称“服务”）提供方与用户之间的基本权利、义务和使用条件。',s:[['1. 服务目的与内容','SnapLog 是用于按主题保存和查看照片、数字、简短备注等内容的个人记录应用。部分功能可免费使用，也可能包含广告或付费功能。'],['2. 服务使用','用户应遵守相关法律和本条款，不得以侵犯他人版权、隐私或其他合法权利的方式使用服务。用户对自己创建和保存的内容负责。'],['3. 用户数据与同步','记录可保存在设备上，也可能通过 Apple iCloud/CloudKit 同步。设备丢失、删除应用、Apple 账户、网络或同步环境问题可能造成数据丢失，因此建议用户另行管理重要数据。'],['4. 广告','免费版本的部分页面可能通过 Google AdMob 显示广告。广告内容和方式会因 Google 与广告方政策、用户同意和设备设置而异。通过外部广告进行的交易适用相应第三方条款。'],['5. 应用内购买与订阅','部分功能可能以应用内购买或订阅形式提供。付款由 Apple App Store 处理，并可能使用 RevenueCat 确认和恢复购买状态及权益。价格和计费周期以购买页面为准；订阅在 Apple 账户中管理或取消。删除应用不会自动取消有效订阅。'],['6. 第三方服务','可能使用 Apple iCloud/CloudKit 与 App Store 支付、Google AdMob 与同意管理工具、RevenueCat 等。第三方服务故障、限制或政策变更可能影响部分功能。'],['7. 服务变更或中断','因功能改进、维护、技术问题、第三方平台政策变化或运营需要，服务的部分或全部内容可能变更或暂时中断。重大变化会在合理范围内予以说明。'],['8. 知识产权','SnapLog 名称、标志、设计、软件及提供方制作内容的权利属于服务提供方或合法权利人。用户自行创建的照片、备注等内容的权利属于用户或原权利人。'],['9. 责任限制','除故意或重大过失外，对于自然灾害、通信故障、第三方服务故障、用户设备或账户问题等合理控制范围之外的原因造成的中断，可在法律允许范围内限制责任。依法不得限制的用户权利不受影响。'],['10. 隐私','有关个人信息和第三方 SDK 的详细内容，请参阅 <a href="../privacy/">SnapLog 隐私政策</a>。'],['11. 条款变更','服务功能、法律或相关政策变化时，本条款可能更新。重大变化将通过应用或网站等方式说明。'],['12. 适用法律与联系方式','本条款依据大韩民国法律解释。<br>运营方：Ziaside<br>邮箱：<a href="mailto:ziaa3761@gmail.com">ziaa3761@gmail.com</a>']]},
'zh-Hant':{back:'← 返回',title:'使用條款',date:'生效日期：2026年8月26日',intro:'本使用條款規範 SnapLog（以下稱「本服務」）提供者與使用者之間的基本權利、義務及使用條件。',s:[['1. 服務目的與內容','SnapLog 是用於依主題保存與查看照片、數字、簡短備註等內容的個人記錄 App。部分功能可免費使用，也可能包含廣告或付費功能。'],['2. 服務使用','使用者應遵守相關法律與本條款，不得以侵害他人著作權、隱私或其他合法權利的方式使用服務。使用者對自己建立與保存的內容負責。'],['3. 使用者資料與同步','記錄可保存在裝置上，也可能透過 Apple iCloud/CloudKit 同步。裝置遺失、刪除 App、Apple 帳號、網路或同步環境問題可能造成資料遺失，因此建議使用者另行管理重要資料。'],['4. 廣告','免費版本的部分畫面可能透過 Google AdMob 顯示廣告。廣告內容與方式會依 Google 與廣告方政策、使用者同意及裝置設定而異。透過外部廣告進行的交易適用相應第三方條款。'],['5. App 內購買與訂閱','部分功能可能以 App 內購買或訂閱形式提供。付款由 Apple App Store 處理，並可能使用 RevenueCat 確認與恢復購買狀態及權益。價格與計費週期以購買畫面為準；訂閱在 Apple 帳號中管理或取消。刪除 App 不會自動取消有效訂閱。'],['6. 第三方服務','可能使用 Apple iCloud/CloudKit 與 App Store 付款、Google AdMob 與同意管理工具、RevenueCat 等。第三方服務故障、限制或政策變更可能影響部分功能。'],['7. 服務變更或中斷','因功能改善、維護、技術問題、第三方平台政策變更或營運需要，服務部分或全部內容可能變更或暫時中斷。重大變更會在合理範圍內說明。'],['8. 智慧財產權','SnapLog 名稱、標誌、設計、軟體及提供者製作內容的權利屬於服務提供者或合法權利人。使用者自行建立的照片、備註等內容權利屬於使用者或原權利人。'],['9. 責任限制','除故意或重大過失外，對於天然災害、通訊故障、第三方服務故障、使用者裝置或帳號問題等合理控制範圍外原因造成的中斷，可在法律允許範圍內限制責任。依法不得限制的使用者權利不受影響。'],['10. 隱私','有關個人資訊與第三方 SDK 的詳細內容，請參閱 <a href="../privacy/">SnapLog 隱私權政策</a>。'],['11. 條款變更','服務功能、法律或相關政策變更時，本條款可能更新。重大變更將透過 App 或網站等方式說明。'],['12. 準據法與聯絡方式','本條款依大韓民國法律解釋。<br>營運者：Ziaside<br>電子郵件：<a href="mailto:ziaa3761@gmail.com">ziaa3761@gmail.com</a>']]},
es:{back:'← Volver',title:'Términos de uso',date:'Vigentes desde: 26 de agosto de 2026',intro:'Estos Términos regulan los derechos, obligaciones y condiciones básicas entre el proveedor de SnapLog (el “Servicio”) y sus usuarios.',s:[['1. Finalidad y contenido del Servicio','SnapLog es una app de registro personal que permite guardar y consultar fotos, números, notas breves y otros registros por temas. Algunas funciones pueden ser gratuitas y otras pueden incluir publicidad o funciones de pago.'],['2. Uso del Servicio','Los usuarios deben cumplir la legislación aplicable y estos Términos. No se debe usar el Servicio de forma que infrinja derechos de autor, privacidad u otros derechos legales. El usuario es responsable del contenido que crea y guarda.'],['3. Datos y sincronización','Los registros pueden guardarse en el dispositivo o sincronizarse mediante Apple iCloud/CloudKit. La pérdida del dispositivo, eliminación de la app, problemas de cuenta de Apple, red o sincronización pueden causar pérdida de datos; se recomienda gestionar por separado los datos importantes.'],['4. Publicidad','Algunas pantallas de la versión gratuita pueden mostrar anuncios mediante Google AdMob. El contenido y forma de los anuncios puede variar según las políticas de Google y anunciantes, el consentimiento y los ajustes del dispositivo. Las transacciones realizadas mediante anuncios externos se rigen por las condiciones del tercero correspondiente.'],['5. Compras y suscripciones','Algunas funciones pueden ofrecerse mediante compras o suscripciones dentro de la app. Apple App Store procesa los pagos y RevenueCat puede usarse para verificar y restaurar compras y derechos. Los precios y periodos de cobro se muestran al comprar. Las suscripciones se gestionan o cancelan en la cuenta de Apple. Eliminar la app no cancela automáticamente una suscripción activa.'],['6. Servicios externos','SnapLog puede usar Apple iCloud/CloudKit y pagos de App Store, Google AdMob y herramientas de consentimiento, y RevenueCat. Fallos, restricciones o cambios de políticas de terceros pueden afectar algunas funciones.'],['7. Cambios o interrupción','El Servicio puede modificarse o suspenderse temporalmente por mejoras, mantenimiento, problemas técnicos, cambios de políticas de plataformas o necesidades operativas. Los cambios importantes se comunicarán cuando sea razonablemente posible.'],['8. Propiedad intelectual','Los derechos sobre el nombre, logotipo, diseño, software y contenidos creados por el proveedor pertenecen al proveedor o titulares legítimos. Los derechos sobre fotos, notas y contenidos creados por el usuario permanecen con el usuario o titular original.'],['9. Limitación de responsabilidad','Salvo dolo o negligencia grave, la responsabilidad puede limitarse, en la medida permitida por la ley, respecto de interrupciones por desastres, fallos de red, servicios externos o problemas del dispositivo/cuenta del usuario. Los derechos que legalmente no puedan limitarse permanecen intactos.'],['10. Privacidad','Consulta la <a href="../privacy/">Política de privacidad de SnapLog</a> para detalles sobre datos personales y SDK de terceros.'],['11. Cambios en los Términos','Estos Términos pueden actualizarse cuando cambien funciones, leyes o políticas relacionadas. Los cambios importantes se comunicarán mediante la app o el sitio web.'],['12. Ley aplicable y contacto','Estos Términos se interpretan conforme a las leyes de la República de Corea.<br>Operador: Ziaside<br>Email: <a href="mailto:ziaa3761@gmail.com">ziaa3761@gmail.com</a>']]},
vi:{back:'← Quay lại',title:'Điều khoản sử dụng',date:'Có hiệu lực từ: 26/08/2026',intro:'Điều khoản này quy định các quyền, nghĩa vụ và điều kiện sử dụng cơ bản giữa nhà cung cấp SnapLog (“Dịch vụ”) và người dùng.',s:[['1. Mục đích và nội dung Dịch vụ','SnapLog là ứng dụng ghi chép cá nhân cho phép lưu và xem ảnh, số liệu, ghi chú ngắn và các bản ghi khác theo chủ đề. Một số tính năng có thể miễn phí, đồng thời có thể có quảng cáo hoặc tính năng trả phí.'],['2. Sử dụng Dịch vụ','Người dùng phải tuân thủ pháp luật áp dụng và Điều khoản này, không sử dụng Dịch vụ theo cách xâm phạm bản quyền, quyền riêng tư hoặc quyền hợp pháp khác của người khác. Người dùng chịu trách nhiệm về nội dung mình tạo và lưu.'],['3. Dữ liệu và đồng bộ','Bản ghi có thể được lưu trên thiết bị hoặc đồng bộ qua Apple iCloud/CloudKit. Mất thiết bị, xóa ứng dụng, vấn đề tài khoản Apple, mạng hoặc đồng bộ có thể dẫn đến mất dữ liệu; người dùng nên tự quản lý riêng dữ liệu quan trọng.'],['4. Quảng cáo','Một số màn hình của phiên bản miễn phí có thể hiển thị quảng cáo qua Google AdMob. Nội dung và cách phân phối quảng cáo có thể thay đổi tùy chính sách Google/nhà quảng cáo, sự đồng ý và cài đặt thiết bị. Giao dịch qua quảng cáo bên ngoài tuân theo điều khoản của bên thứ ba tương ứng.'],['5. Mua hàng và đăng ký','Một số tính năng có thể được cung cấp qua mua hàng trong ứng dụng hoặc đăng ký. Thanh toán do Apple App Store xử lý và RevenueCat có thể được dùng để xác minh, khôi phục trạng thái mua và quyền sử dụng. Giá và chu kỳ thanh toán hiển thị khi mua. Đăng ký được quản lý hoặc hủy trong tài khoản Apple. Xóa ứng dụng không tự động hủy đăng ký đang hoạt động.'],['6. Dịch vụ bên thứ ba','SnapLog có thể dùng Apple iCloud/CloudKit và thanh toán App Store, Google AdMob cùng công cụ đồng ý, và RevenueCat. Sự cố, hạn chế hoặc thay đổi chính sách của bên thứ ba có thể ảnh hưởng một số tính năng.'],['7. Thay đổi hoặc gián đoạn Dịch vụ','Dịch vụ có thể được thay đổi hoặc tạm ngừng vì cải tiến, bảo trì, vấn đề kỹ thuật, thay đổi chính sách nền tảng hoặc nhu cầu vận hành. Thay đổi quan trọng sẽ được thông báo trong phạm vi hợp lý.'],['8. Sở hữu trí tuệ','Quyền đối với tên SnapLog, logo, thiết kế, phần mềm và nội dung do nhà cung cấp tạo thuộc về nhà cung cấp hoặc chủ sở hữu hợp pháp. Quyền đối với ảnh, ghi chú và nội dung do người dùng tạo thuộc về người dùng hoặc chủ sở hữu ban đầu.'],['9. Giới hạn trách nhiệm','Trừ trường hợp cố ý hoặc sơ suất nghiêm trọng, trách nhiệm có thể được giới hạn trong phạm vi pháp luật cho phép đối với gián đoạn do thiên tai, lỗi mạng, dịch vụ bên thứ ba hoặc vấn đề thiết bị/tài khoản người dùng. Các quyền không thể bị giới hạn theo pháp luật vẫn được bảo lưu.'],['10. Quyền riêng tư','Xem <a href="../privacy/">Chính sách quyền riêng tư SnapLog</a> để biết chi tiết về thông tin cá nhân và SDK bên thứ ba.'],['11. Thay đổi Điều khoản','Điều khoản có thể được cập nhật khi tính năng, pháp luật hoặc chính sách liên quan thay đổi. Thay đổi quan trọng sẽ được thông báo qua ứng dụng hoặc website.'],['12. Luật áp dụng và liên hệ','Điều khoản này được giải thích theo pháp luật Đại Hàn Dân Quốc.<br>Đơn vị vận hành: Ziaside<br>Email: <a href="mailto:ziaa3761@gmail.com">ziaa3761@gmail.com</a>']]}}
function render(l){const d=docs[l]||docs.ko;document.documentElement.lang=l;document.getElementById('back').textContent=d.back;document.getElementById('content').innerHTML=`<h1>${d.title}</h1><div class="date">${d.date}</div><p>${d.intro}</p>${d.s.map(x=>`<h2>${x[0]}</h2><p>${x[1]}</p>`).join('')}<div class="box">SnapLog · Ziaside</div>`;localStorage.setItem('snaplog-lang',l)}const s=document.getElementById('language');const saved=localStorage.getItem('snaplog-lang')||'ko';s.value=docs[saved]?saved:'ko';render(s.value);s.addEventListener('change',e=>render(e.target.value));
</script></body></html>
