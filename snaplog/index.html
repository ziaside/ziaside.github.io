<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SnapLog App Store Preview">
<title>SnapLog</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#222}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.header{height:72px;border-bottom:1px solid #eceff3;display:flex;align-items:center}
.header-inner{width:min(1440px,calc(100% - 48px));margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:800;letter-spacing:-.04em}
.back{font-size:14px;color:#737982}
.page{width:min(1560px,calc(100% - 64px));margin:0 auto;padding:52px 0 80px}
.app-head{display:flex;align-items:center;justify-content:space-between;gap:28px;width:min(1100px,100%);margin:0 auto 46px;padding:0 4px}
.app-identity{display:flex;align-items:center;gap:18px;min-width:0}
.app-icon{width:92px;height:92px;border-radius:22px;border:1px solid #edf0f4;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:0 8px 24px rgba(34,34,34,.05);font-size:16px;font-weight:850;letter-spacing:-.06em;line-height:1.02;text-align:center}
.app-copy h1{margin:0 0 7px;font-size:32px;line-height:1.05;letter-spacing:-.04em}.app-copy p{margin:0;color:#7d8490;font-size:15px}.download{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:116px;height:48px;padding:0 24px;border-radius:24px;background:#0a84ff;color:#fff;font-size:16px;font-weight:750;box-shadow:0 8px 20px rgba(10,132,255,.18);transition:transform .15s ease,opacity .15s ease}.download:hover{opacity:.9;transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;align-items:start}
.card{background:#fff;border:1px solid #edf0f4;border-radius:28px;overflow:hidden;box-shadow:0 14px 40px rgba(34,34,34,.06)}
.card img{display:block;width:100%;height:auto}
.footer{width:min(1440px,calc(100% - 48px));margin:0 auto;padding:28px 0 36px;border-top:1px solid #eceff3;color:#8b9199;font-size:12px;display:flex;justify-content:space-between;gap:20px}
.footer-links{display:flex;gap:16px;flex-wrap:wrap}
.footer-links a:hover{color:#222}
@media(max-width:900px){
 .page{width:min(100% - 28px,680px);padding:28px 0 48px}
 .app-head{margin-bottom:28px;gap:14px}.app-icon{width:72px;height:72px;border-radius:18px;font-size:13px}.app-identity{gap:13px}.app-copy h1{font-size:25px}.app-copy p{font-size:13px}.download{min-width:88px;height:42px;padding:0 18px;font-size:15px}
 .grid{grid-template-columns:1fr;gap:18px}
 .card{border-radius:20px}
 .header{height:64px}
 .header-inner,.footer{width:calc(100% - 28px)}
 .footer{flex-direction:column;gap:10px}
}
@media(max-width:520px){.app-head{align-items:flex-start}.app-copy p{max-width:155px}.download{margin-top:14px}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a class="logo" href="#">SNAP LOG</a>
    <a class="back" href="../">Ziaside로 돌아가기</a>
  </div>
</header>
<main class="page">
  <section class="app-head" aria-label="SnapLog 다운로드">
    <div class="app-identity">
      <div class="app-icon" aria-hidden="true">SNAP<br>LOG</div>
      <div class="app-copy"><h1>SnapLog</h1><p>흩어진 기록을 하나의 로그로</p></div>
    </div>
    <a class="download" href="https://apps.apple.com/us/app/id6800627643" target="_blank" rel="noopener noreferrer" aria-label="App Store에서 SnapLog 다운로드">받기</a>
  </section>
  <section class="grid" aria-label="SnapLog App Store screenshots">
    <figure class="card"><img src="https://www.figma.com/api/mcp/asset/f547c1a0-e0a7-4883-bf24-23346f8772fd.png" alt="SnapLog 앱스토어 스크린샷 1"></figure>
    <figure class="card"><img src="https://www.figma.com/api/mcp/asset/81401d9e-dc7a-4724-8488-6302f7205893.png" alt="SnapLog 앱스토어 스크린샷 2"></figure>
    <figure class="card"><img src="https://www.figma.com/api/mcp/asset/086613e8-513f-4d28-9a83-4c36082f1d8b.png" alt="SnapLog 앱스토어 스크린샷 3"></figure>
  </section>
</main>
<footer class="footer">
  <span>© 2026 Ziaside</span>
  <div class="footer-links"><a href="./feedback/">피드백 보내기</a><a href="./terms/">이용약관</a><a href="./privacy/">개인정보처리방침</a><span>SnapLog · iOS</span></div>
</footer>
</body>
</html>
