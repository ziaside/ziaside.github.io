const copy={
ko:{back:'Apps',get:'받기',subtitle:'흩어진 기록을 하나의 로그로',preview:'미리보기',updates:'업데이트 기록',logTitle11:'v1.1 · SnapLog Pro 업데이트',logDesc11:'SnapLog Pro가 추가되고, 알림·다국어·통계·내보내기·iCloud 동기화 기능이 개선되었습니다.',logTitle:'v1.0 · App Store 첫 출시',logDesc:'사진과 간단한 기록, 주제별 관리, 달력, 통계, 월간 이미지 저장 기능으로 SnapLog를 처음 출시했습니다.',feedback:'피드백 보내기',terms:'이용약관',privacy:'개인정보처리방침',html:`<h2>흩어진 기록을 하나의 로그로.</h2><p>운동, 식단, 반려동물, 취미, 일상까지. 여러 앱에 나뉘어 있던 기록을 이제 SnapLog 하나에 모아보세요.</p><p>SnapLog는 사진 한 장과 숫자 또는 짧은 코멘트로 다양한 일상의 기록을 간편하게 남길 수 있는 기록 앱입니다.</p><h3>원하는 주제로 자유롭게 기록하세요</h3><p>운동, 식단, 체중, 반려동물, 취미, 영화, 일상 등 원하는 주제를 만들고 각각의 기록을 한곳에서 관리할 수 있어요.</p><h3>사진과 함께 간단하게</h3><p>사진 한 장에 숫자 또는 짧은 코멘트를 더해 빠르게 기록할 수 있어요.</p><h3>달력으로 한눈에</h3><p>날짜마다 쌓인 사진을 달력에서 한눈에 확인하고 지난 기록을 자연스럽게 돌아볼 수 있어요.</p><h3>기록한 변화는 통계로</h3><p>기록한 Snap은 월별 통계로 확인할 수 있어요.</p><h3>한 달의 기록을 한 장으로</h3><p>월간 기록을 이미지로 만들어 저장하거나 공유할 수 있어요.</p>`},
en:{back:'Apps',get:'Get',subtitle:'All your records in one log',preview:'Preview',updates:'Version History',logTitle11:'v1.1 · SnapLog Pro Update',logDesc11:'SnapLog Pro has been added, with improvements to notifications, multilingual support, statistics, exports, and iCloud sync.',logTitle:'v1.0 · First App Store release',logDesc:'SnapLog launched with photo-based logging, custom topics, calendar browsing, monthly statistics, and monthly image export.',feedback:'Send Feedback',terms:'Terms of Use',privacy:'Privacy Policy',html:`<h2>Bring scattered records into one log.</h2><p>From workouts and meals to pets, hobbies, and everyday life, keep all your records together in SnapLog instead of spreading them across multiple apps.</p><p>SnapLog is a simple logging app that lets you record everyday moments with a photo, a number, or a short note.</p><h3>Create topics that fit your life</h3><p>Create topics for workouts, meals, weight, pets, hobbies, movies, daily life, and more, then manage each record in one place.</p><h3>Log quickly with photos</h3><p>Add a number or a short note to a photo and save your record in seconds.</p><h3>See everything on a calendar</h3><p>View your photos by date on a calendar and look back on past records with ease.</p><h3>Track changes with monthly stats</h3><p>Review your recorded Snaps through monthly statistics.</p><h3>Save a month in one image</h3><p>Turn your monthly records into an image you can save or share.</p>`},
ja:{back:'Apps',get:'入手',subtitle:'散らばる記録を、ひとつのログに',preview:'プレビュー',updates:'アップデート履歴',logTitle11:'v1.1 · SnapLog Pro アップデート',logDesc11:'SnapLog Proが追加され、通知・多言語対応・統計・エクスポート・iCloud同期機能が改善されました。',logTitle:'v1.0 · App Store 初回リリース',logDesc:'写真ベースの記録、テーマ管理、カレンダー、月別統計、月間画像の保存機能とともにSnapLogをリリースしました。',feedback:'フィードバック',terms:'利用規約',privacy:'プライバシーポリシー',html:`<h2>散らばった記録を、ひとつのログに。</h2><p>運動、食事、ペット、趣味、日常まで。複数のアプリに分かれていた記録を、SnapLogひとつにまとめましょう。</p><p>SnapLogは、写真1枚に数字や短いメモを添えて日々の記録を手軽に残せる記録アプリです。</p><h3>好きなテーマで自由に記録</h3><p>運動、食事、体重、ペット、趣味、映画、日常など、好きなテーマを作成して1か所で管理できます。</p><h3>写真と一緒に手軽に記録</h3><p>写真1枚に数字や短いコメントを加えるだけですばやく記録できます。</p><h3>カレンダーでひと目で確認</h3><p>日付ごとの写真を一覧し、過去の記録を自然に振り返れます。</p><h3>変化は月ごとの統計で</h3><p>記録したSnapを月ごとの統計で確認できます。</p><h3>1か月の記録を1枚に</h3><p>月間の記録を画像にして保存・共有できます。</p>`},
'zh-Hans':{back:'Apps',get:'获取',subtitle:'零散记录，汇成一个日志',preview:'预览',updates:'更新记录',logTitle11:'v1.1 · SnapLog Pro 更新',logDesc11:'新增 SnapLog Pro，并改进了通知、多语言支持、统计、导出和 iCloud 同步功能。',logTitle:'v1.0 · App Store 首次发布',logDesc:'SnapLog 首次上线，支持照片记录、主题管理、日历浏览、月度统计和月度图片导出。',feedback:'发送反馈',terms:'使用条款',privacy:'隐私政策',html:`<h2>把零散记录，汇成一个日志。</h2><p>无论是运动、饮食、宠物、兴趣还是日常生活，都可以统一记录在 SnapLog 中。</p><p>SnapLog 是一款简单的记录应用，可以通过一张照片、一个数字或一段简短文字轻松记录生活。</p><h3>按你喜欢的主题自由记录</h3><p>创建运动、饮食、体重、宠物、兴趣、电影、日常等不同主题，并在一个地方统一管理。</p><h3>结合照片，轻松记录</h3><p>在照片上添加数字或简短备注，就能快速完成记录。</p><h3>通过日历一目了然</h3><p>按日期查看照片，轻松回顾过去的记录。</p><h3>用月度统计查看变化</h3><p>通过每月统计查看已记录的 Snap。</p><h3>把一个月的记录保存成一张图</h3><p>将月度记录生成图片，保存或分享。</p>`},
'zh-Hant':{back:'Apps',get:'取得',subtitle:'零散記錄，匯成一個日誌',preview:'預覽',updates:'更新記錄',logTitle11:'v1.1 · SnapLog Pro 更新',logDesc11:'新增 SnapLog Pro，並改善了通知、多語言支援、統計、匯出與 iCloud 同步功能。',logTitle:'v1.0 · App Store 首次發布',logDesc:'SnapLog 首次上線，提供照片記錄、主題管理、日曆瀏覽、每月統計與月間圖片匯出。',feedback:'傳送意見',terms:'使用條款',privacy:'隱私權政策',html:`<h2>將零散的記錄，匯成一個日誌。</h2><p>無論是運動、飲食、寵物、興趣還是日常生活，都能統一記錄在 SnapLog 裡。</p><p>SnapLog 是一款簡單的記錄 App，可以用一張照片、一個數字或簡短文字輕鬆記下生活。</p><h3>依照你想要的主題自由記錄</h3><p>建立運動、飲食、體重、寵物、興趣、電影、日常等主題，並在同一個地方管理。</p><h3>搭配照片，輕鬆記錄</h3><p>在照片上加入數字或簡短備註，就能快速完成記錄。</p><h3>用日曆一目了然地查看</h3><p>依日期查看照片，輕鬆回顧過去的記錄。</p><h3>用每月統計查看變化</h3><p>透過每月統計查看已記錄的 Snap。</p><h3>將一個月的記錄保存成一張圖片</h3><p>把每月記錄製作成圖片，方便保存或分享。</p>`},
es:{back:'Apps',get:'Obtener',subtitle:'Tus registros en un solo lugar',preview:'Vista previa',updates:'Historial de versiones',logTitle11:'v1.1 · Actualización de SnapLog Pro',logDesc11:'Se añadió SnapLog Pro y se mejoraron las notificaciones, la compatibilidad multilingüe, las estadísticas, la exportación y la sincronización con iCloud.',logTitle:'v1.0 · Primer lanzamiento en App Store',logDesc:'SnapLog se lanzó con registros basados en fotos, temas personalizados, calendario, estadísticas mensuales y exportación de imágenes mensuales.',feedback:'Enviar comentarios',terms:'Términos de uso',privacy:'Política de privacidad',html:`<h2>Reúne tus registros en un solo lugar.</h2><p>Desde ejercicio y comidas hasta mascotas, hobbies y vida diaria, guarda todo en SnapLog en lugar de usar varias apps.</p><p>SnapLog es una app sencilla para registrar tu día a día con una foto, un número o una nota breve.</p><h3>Crea temas según tu estilo de vida</h3><p>Crea temas para ejercicio, comidas, peso, mascotas, hobbies, películas, vida diaria y más.</p><h3>Registra de forma rápida con fotos</h3><p>Añade un número o una nota breve a una foto y guarda tu registro en segundos.</p><h3>Ve todo de un vistazo en el calendario</h3><p>Consulta tus fotos por fecha y revisa fácilmente tus registros anteriores.</p><h3>Sigue los cambios con estadísticas mensuales</h3><p>Revisa tus Snaps mediante estadísticas mensuales.</p><h3>Guarda un mes entero en una sola imagen</h3><p>Convierte tus registros mensuales en una imagen para guardarla o compartirla.</p>`},
vi:{back:'Apps',get:'Nhận',subtitle:'Gom mọi ghi chép vào một nhật ký',preview:'Xem trước',updates:'Lịch sử cập nhật',logTitle11:'v1.1 · Cập nhật SnapLog Pro',logDesc11:'Đã bổ sung SnapLog Pro và cải thiện thông báo, hỗ trợ đa ngôn ngữ, thống kê, xuất dữ liệu và đồng bộ iCloud.',logTitle:'v1.0 · Phát hành lần đầu trên App Store',logDesc:'SnapLog ra mắt với ghi chép bằng ảnh, quản lý chủ đề, lịch, thống kê theo tháng và xuất ảnh tổng hợp theo tháng.',feedback:'Gửi phản hồi',terms:'Điều khoản sử dụng',privacy:'Chính sách quyền riêng tư',html:`<h2>Gom mọi ghi chép rời rạc vào một nhật ký.</h2><p>Từ tập luyện, ăn uống, thú cưng, sở thích đến cuộc sống hằng ngày, bạn có thể lưu tất cả trong SnapLog.</p><p>SnapLog là ứng dụng ghi chép đơn giản giúp bạn lưu lại cuộc sống bằng một bức ảnh, một con số hoặc một ghi chú ngắn.</p><h3>Tạo chủ đề theo cách của bạn</h3><p>Tạo chủ đề cho tập luyện, ăn uống, cân nặng, thú cưng, sở thích, phim ảnh và cuộc sống hằng ngày.</p><h3>Ghi lại nhanh chóng cùng ảnh</h3><p>Thêm một con số hoặc ghi chú ngắn vào ảnh để lưu lại bản ghi chỉ trong vài giây.</p><h3>Xem lại dễ dàng bằng lịch</h3><p>Xem ảnh theo từng ngày và nhìn lại các ghi chép cũ một cách thuận tiện.</p><h3>Theo dõi thay đổi bằng thống kê hàng tháng</h3><p>Xem lại các Snap bằng thống kê theo tháng.</p><h3>Lưu cả tháng trong một hình ảnh</h3><p>Biến các ghi chép hàng tháng thành một hình ảnh để lưu hoặc chia sẻ.</p>`}

function normalizeLanguage(value){if(copy[value])return value;const locale=String(value||'').replace('_','-');if(/^zh(?:-|$)/i.test(locale))return /(?:hant|tw|hk|mo)/i.test(locale)?'zh-Hant':'zh-Hans';const base=locale.split('-')[0].toLowerCase();return copy[base]?base:'ko'}
function apply(language){const lang=normalizeLanguage(language);const t=copy[lang];const s=screenshots[lang];document.documentElement.lang=lang;document.getElementById('back').textContent=t.back;document.getElementById('download').textContent=t.get;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('previewTitle').textContent=t.preview;document.getElementById('description').innerHTML=t.html;document.getElementById('updatesTitle').textContent=t.updates;document.getElementById('logTitle11').textContent=t.logTitle11;document.getElementById('logDesc11').textContent=t.logDesc11;document.getElementById('logTitle').textContent=t.logTitle;document.getElementById('logDesc').textContent=t.logDesc;document.getElementById('feedback').textContent=t.feedback;document.getElementById('terms').textContent=t.terms;document.getElementById('privacy').textContent=t.privacy;document.getElementById('screen1').src=s[0];document.getElementById('screen2').src=s[1];document.getElementById('screen3').src=s[2];document.getElementById('language').value=lang;localStorage.setItem('snaplogLang',lang)}
const select=document.getElementById('language');const saved=localStorage.getItem('snaplogLang');apply(saved||navigator.language||'ko');select.addEventListener('change',e=>apply(e.target.value));
