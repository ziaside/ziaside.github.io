<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SnapLog App Store Preview">
<title>SnapLog</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;color:#222}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.header{height:72px;border-bottom:1px solid #eceff3;display:flex;align-items:center}
.header-inner{width:min(1440px,calc(100% - 48px));margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:18px;font-weight:800;letter-spacing:-.04em}
.back{font-size:14px;color:#737982}
.page{width:min(1560px,calc(100% - 64px));margin:0 auto;padding:64px 0 80px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;align-items:start}
.card{background:#fff;border:1px solid #edf0f4;border-radius:28px;overflow:hidden;box-shadow:0 14px 40px rgba(34,34,34,.06)}
.card img{display:block;width:100%;height:auto}
.footer{width:min(1440px,calc(100% - 48px));margin:0 auto;padding:28px 0 36px;border-top:1px solid #eceff3;color:#8b9199;font-size:12px;display:flex;justify-content:space-between}
@media(max-width:900px){
 .page{width:min(100% - 28px,680px);padding:28px 0 48px}
 .grid{grid-template-columns:1fr;gap:18px}
 .card{border-radius:20px}
 .header{height:64px}
 .header-inner,.footer{width:calc(100% - 28px)}
 .footer{flex-direction:column;gap:8px}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a class="logo" href="#">SNAP LOG</a>
    <a class="back" href="../">Ziaside로 돌아가기</a>
  </div>
</header>
<main class="page">
  <section class="grid" aria-label="SnapLog App Store screenshots">
    <figure class="card"><img src="https://www.figma.com/api/mcp/asset/81401d9e-dc7a-4724-8488-6302f7205893.png" alt="SnapLog 앱스토어 스크린샷 1"></figure>
    <figure class="card"><img src="https://www.figma.com/api/mcp/asset/086613e8-513f-4d28-9a83-4c36082f1d8b.png" alt="SnapLog 앱스토어 스크린샷 2"></figure>
    <figure class="card"><img src="https://www.figma.com/api/mcp/asset/f547c1a0-e0a7-4883-bf24-23346f8772fd.png" alt="SnapLog 앱스토어 스크린샷 3"></figure>
  </section>
</main>
<footer class="footer"><span>© 2026 Ziaside</span><span>SnapLog · iOS</span></footer>
</body>
</html>
