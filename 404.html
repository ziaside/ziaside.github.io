<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>페이지를 찾을 수 없습니다 | zia.log</title>
  <style>
    :root{--bg:#fff;--text:#111;--muted:#777772;--line:#e8e8e8;--card:#f5f5f5}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .page{width:min(1180px,calc(100% - 48px));margin:0 auto;min-height:100vh;padding:36px 0 28px;display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;padding-bottom:28px;border-bottom:1px solid var(--line)}
    .brand{font-size:18px;font-weight:700;letter-spacing:-.03em}
    .error{flex:1;display:flex;align-items:center;padding:76px 0}
    .error-inner{max-width:680px}
    .code{margin:0 0 22px;font-size:13px;color:var(--muted)}
    h1{margin:0;font-size:clamp(38px,6vw,72px);line-height:1.16;letter-spacing:-.05em;font-weight:700;word-break:keep-all}
    .description{margin:24px 0 0;color:var(--muted);font-size:16px;line-height:1.7;word-break:keep-all}
    .home-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;margin-top:34px;padding:10px 18px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px;transition:opacity .18s ease}
    .home-link:hover{opacity:.62}
    .home-link:focus-visible{outline:2px solid var(--text);outline-offset:3px}
    .footer{padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    @media(max-width:760px){.page{width:min(100% - 32px,1180px);padding-top:24px}.error{align-items:flex-start;padding:76px 0}.description{margin-top:20px}.home-link{margin-top:30px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><a class="brand" href="/">zia.log</a></header>
    <section class="error" aria-labelledby="error-title">
      <div class="error-inner">
        <p class="code">404</p>
        <h1 id="error-title">페이지를 찾을 수 없습니다</h1>
        <p class="description">요청하신 페이지가 존재하지 않거나 이동되었습니다.</p>
        <a class="home-link" href="/">홈으로 돌아가기</a>
      </div>
    </section>
    <footer class="footer">© 2026 zia.log</footer>
  </main>
</body>
</html>
